services:
  qwen38:
    image: lmsysorg/sglang:qwen38-27b
    container_name: qwen38-sglang
    entrypoint: ["sglang"]
    command:
      - serve
      - --trust-remote-code
      - --model-path
      - ${MODEL_ID:-RadixArk/Qwen3.8-27B-NVFP4}
      - --mem-fraction-static
      - ${MEM_FRACTION_STATIC:-0.7}
      - --max-total-tokens
      - ${MAX_MODEL_LEN:-131072}
      - --attention-backend
      - flashinfer
      - --chunked-prefill-size
      - ${CHUNKED_PREFILL_SIZE:-8192}
      - --disable-prefill-cuda-graph
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --allow-auto-truncate
      - --host
      - ${BIND_HOST:-0.0.0.0}
      - --port
      - ${CONTAINER_PORT:-8000}
    environment:
      - HF_HOME=${HF_CACHE_CONTAINER_DIR:-/root/.cache/huggingface}
    volumes:
      - ${HF_CACHE_HOST_DIR:-~/.cache/huggingface}:${HF_CACHE_CONTAINER_DIR:-/root/.cache/huggingface}
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    ipc: host
    shm_size: "${SHM_SIZE:-32g}"
    restart: "${RESTART_POLICY:-unless-stopped}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:${CONTAINER_PORT:-8000}/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
